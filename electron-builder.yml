appId: dev.brickyard.app
productName: Brickyard
copyright: Copyright (c) 2026 Brickyard contributors
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# The agent bridge (out/main/agent-mcp.js) is executed by other programs, so it must live outside the asar.
asarUnpack:
  - resources/**
  - out/main/**
win:
  executableName: Brickyard
  icon: build/icon.ico
  target:
    - nsis
nsis:
  # A fixed name keeps https://github.com/izzyfrm/brickyard/releases/latest/download/Brickyard-Setup.exe stable.
  artifactName: Brickyard-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  notarize: false
dmg:
  artifactName: Brickyard-${version}.${ext}
linux:
  target:
    - AppImage
  category: Development
appImage:
  artifactName: Brickyard-${version}.${ext}
npmRebuild: false
